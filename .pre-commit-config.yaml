repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must equal required-version in pyproject.toml. The hook reads that file,
    # so a mismatch here does not merely lint differently - ruff refuses to
    # start.
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
