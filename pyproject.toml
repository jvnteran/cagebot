[project]
name = "cagebot"
version = "1.0.0"
description = "End-to-End ML Fight Prediction Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Juan Vicente Navas Teran"}]

dependencies = [
    "pandas>=2.0.0",
    "psycopg2-binary>=2.9.0",
    # Keep in step with dashboard/requirements.txt: the 1.56 floor is st.iframe
    # (components/globe.py) and the upper bound keeps a major release from
    # landing unreviewed.
    "streamlit>=1.56,<2",
    "plotly>=6.0.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    # Pinned exactly, not floored. `[tool.ruff]` below configures only
    # target-version and line-length, so the rule set IS whatever the installed
    # release calls default - and when those defaults move, files that have not
    # changed start failing a standard nobody chose.
    "ruff==0.15.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Belt to the dependency pin's braces: this refuses to run at all under a
# different version, rather than silently linting against different defaults.
# It applies wherever ruff reads this file - CI, pre-commit, and a contributor's
# shell - which is the point.
required-version = "==0.15.10"
target-version = "py310"
line-length = 120
