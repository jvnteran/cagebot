[project]
name = "cagebot"
version = "1.0.0"
description = "End-to-End ML Fight Prediction Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Juan Vicente Navas Teran"}]

dependencies = [
    "pandas>=2.0.0",
    "psycopg2-binary>=2.9.0",
    # Keep in step with dashboard/requirements.txt: the 1.56 floor is st.iframe
    # (components/globe.py) and the upper bound keeps a major release from
    # landing unreviewed.
    "streamlit>=1.56,<2",
    "plotly>=6.0.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
